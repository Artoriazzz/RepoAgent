[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent"
version = "0.2.0"
description = "A framework-independent multi-agent system for repository maintenance and program repair."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Artoriazzz" },
]
keywords = [
    "agent",
    "github",
    "program-repair",
    "swe-bench",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/Artoriazzz/RepoAgent"
Repository = "https://github.com/Artoriazzz/RepoAgent.git"
Issues = "https://github.com/Artoriazzz/RepoAgent/issues"

[project.optional-dependencies]
dev = ["pytest"]
worker = ["pika>=1.3,<2.0"]
benchmark = ["pandas>=2.0,<3.0", "pyarrow>=12,<24"]

[project.scripts]
repo-agent = "repo_agent.cli:main"
repo-agent-worker = "repo_agent.worker.main:main"
repo-agent-memory-merge-worker = "repo_agent.worker.memory_merge_worker:main"
repo-agent-benchmark-submit = "repo_agent.benchmark.simulator:main"
repo-agent-pipeline-benchmark = "repo_agent.benchmark.pipeline_benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
