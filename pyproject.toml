[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-agent-plain"
version = "0.1.0"
description = "A lightweight repository agent without high-level agent SDKs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
repo-agent = "repo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repo_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
