services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: repoagent
      MYSQL_USER: repoagent
      MYSQL_PASSWORD: repoagent
      MYSQL_ROOT_PASSWORD: repoagent-root
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: repoagent
      RABBITMQ_DEFAULT_PASS: repoagent
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      # Qdrant 没有对外鉴权，作为后端内部依赖仅绑定到本机。
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # 官方镜像不携带 curl/wget，使用 Bash 内建 TCP 探测避免把健康实例误判为 unhealthy。
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  qdrant-data:
