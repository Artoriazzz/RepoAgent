<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="620" viewBox="0 0 1700 620" role="img" aria-labelledby="title description">
  <title id="title">经验召回驱动的多 Agent 修复闭环</title>
  <desc id="description">公开问题经查询提取与经验召回后进入 Coordinator、首次实现和验证。失败进入归因、纠正实现和再次验证。纠正失败时判断预算，预算耗尽则结束，否则回到 Coordinator；成功后整理经验。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .heading { font-size: 30px; font-weight: 700; fill: #17212b; }
      .label { font-size: 21px; font-weight: 700; fill: #17212b; text-anchor: middle; }
      .detail { font-size: 18px; fill: #526170; text-anchor: middle; }
      .edge-label { font-size: 18px; fill: #526170; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .success { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#green); }
      .return { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linejoin: round; marker-end: url(#blue); }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1700" height="620" rx="8" fill="#ffffff"/>
  <text x="28" y="43" class="heading">经验召回驱动的修复闭环</text>
  <text x="1648" y="42" text-anchor="end" font-size="18" fill="#64748b">统一协作设计</text>

  <path d="M 1492 160 V 85 H 526 V 160" class="success" stroke-dasharray="7 6"/>
  <rect x="882" y="65" width="240" height="34" fill="#fff"/>
  <text x="1002" y="89" text-anchor="middle" font-size="19" fill="#0f766e">后续任务检索复用</text>

  <rect x="24" y="160" width="150" height="102" rx="7" class="box"/>
  <text x="99" y="203" class="label">公开 Issue</text>
  <text x="99" y="233" class="detail">基线仓库</text>
  <rect x="208" y="160" width="190" height="102" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="303" y="195" class="label" font-size="20">MemoryQueryAgent</text>
  <text x="303" y="225" class="detail">问题描述 / 使用场景</text>
  <rect x="436" y="160" width="180" height="102" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="526" y="195" class="label">经验 RAG</text>
  <text x="526" y="225" class="detail">全局 + 仓库经验</text>
  <rect x="656" y="160" width="196" height="102" rx="7" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="754" y="195" class="label">Coordinator</text>
  <text x="754" y="225" class="detail">定位 / 决策 / 授权</text>
  <rect x="892" y="160" width="194" height="102" rx="7" class="box"/>
  <text x="989" y="195" class="label">Initial Implement</text>
  <text x="989" y="225" class="detail">首次代码修复</text>
  <rect x="1126" y="160" width="174" height="102" rx="7" class="box"/>
  <text x="1213" y="195" class="label">Harness</text>
  <text x="1213" y="225" class="detail">独立验证</text>
  <rect x="1360" y="160" width="265" height="102" rx="7" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="1492" y="195" class="label">ExperienceCurator</text>
  <text x="1492" y="225" class="detail">抽象 / 合并 / 保存经验</text>
  <path d="M 174 211 H 208" class="line"/>
  <path d="M 398 211 H 436" class="line"/>
  <path d="M 616 211 H 656" class="line"/>
  <path d="M 852 211 H 892" class="line"/>
  <path d="M 1086 211 H 1126" class="line"/>
  <path d="M 1300 211 H 1360" class="success"/>
  <text x="1309" y="193" font-size="17" fill="#0f766e">通过</text>

  <rect x="1090" y="355" width="246" height="102" rx="7" class="box"/>
  <text x="1213" y="390" class="label">FailureReview</text>
  <text x="1213" y="420" class="detail">失败事实 / 纠正依据</text>
  <rect x="810" y="355" width="230" height="102" rx="7" class="box"/>
  <text x="925" y="390" class="label">Corrective Implement</text>
  <text x="925" y="420" class="detail">定向纠正已有 patch</text>
  <rect x="580" y="355" width="190" height="102" rx="7" class="box"/>
  <text x="675" y="390" class="label">Harness</text>
  <text x="675" y="420" class="detail">再次独立验证</text>
  <path d="M 422 350 L 516 406 L 422 462 L 328 406 Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="422" y="413" class="label">预算耗尽？</text>
  <rect x="302" y="511" width="240" height="64" rx="7" fill="#fff1f2" stroke="#fda4af"/>
  <text x="422" y="551" class="label">结束并保存结果</text>

  <path d="M 1213 262 V 355" class="line"/>
  <text x="1230" y="309" class="edge-label">未通过</text>
  <path d="M 1090 406 H 1040" class="line"/>
  <path d="M 810 406 H 770" class="line"/>
  <path d="M 580 406 H 516" class="line"/>
  <text x="518" y="386" class="edge-label" font-size="16">未通过</text>
  <path d="M 422 462 V 511" class="line"/>
  <text x="440" y="493" class="edge-label">是</text>
  <path d="M 422 350 V 303 H 754 V 262" class="return"/>
  <rect x="450" y="287" width="267" height="31" fill="#fff"/>
  <text x="583" y="309" text-anchor="middle" font-size="18" fill="#2563eb">否：回到 Coordinator 重新决策</text>
  <path d="M 675 457 V 551 H 1656 V 211 H 1625" class="success"/>
  <rect x="1020" y="535" width="278" height="32" fill="#fff"/>
  <text x="1159" y="558" text-anchor="middle" font-size="19" fill="#0f766e">通过：进入经验整理</text>
  <text x="28" y="600" font-size="16" fill="#64748b">经验仅在协调阶段召回；成功后维护经验。实际调度路径与预算由运行入口配置。</text>
</svg>
